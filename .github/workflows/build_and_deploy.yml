name: build and push

on:
  push:
    - env-test
    - env-qa


permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: build & deploy
    runs-on:
    - self-hosted

    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkou@v3

      - name: building and setting docker environment on server

       run:
        docker-compose -f ./docker-compose/docker-composer.yml -p mapbook_ab up --build -d